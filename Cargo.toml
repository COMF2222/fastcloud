[package]
name = "fastcloud"
version = "0.1.0"
edition = "2024"
description = "Native SoundCloud client"
license = "MIT"
repository = "https://github.com/fastcloud/fastcloud"
rust-version = "1.85"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image"] }
env_logger = "0.11"
log = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query", "form"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
thiserror = "2"
anyhow = "1"

keyring = { version = "4", features = ["v1"] }
directories = "6"
dirs = "6"

symphonia = { version = "0.6", features = ["aac", "mp3", "isomp4"] }
cpal = "0.18"

clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rubato = "5"
once_cell = "1"
bytes = "1.12.1"
webbrowser = "1.2.4"
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["async-io"] }
zbus = "5"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
global-hotkey = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }
winapi = { version = "0.3", features = ["winuser"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24"
souvlaki = { version = "0.8", features = ["use_zbus"] }
global-hotkey = "0.8"

[features]
default = []
demo = []

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1

[dev-dependencies]
tempfile = "3"

[package.metadata.release]
tag-name = "v{{version}}"
