name: CLAP resources
description: Reuse pinned model files and a verified native worker
inputs:
  arch:
    description: Native architecture (x64, aarch64 or x86_64)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: desktop/src-tauri/resources/clap/model
        # The revision is pinned in both preparation scripts. Model bytes are
        # identical on every platform; worker caches below remain native.
        key: clap-model-v1-${{ hashFiles('tools/prepare_private_clap.ps1', 'tools/prepare_macos_clap.py', 'tools/verify_clap_worker.py') }}
    - uses: actions/cache@v4
      with:
        path: desktop/src-tauri/resources/clap/worker-lite
        key: clap-worker-v2-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles('desktop/clap_worker.py', 'desktop/clap_features.py', 'tools/prepare_private_clap.ps1', 'tools/prepare_macos_clap.py', 'tools/verify_clap_worker.py') }}
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - name: Prepare and verify Windows worker
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/prepare_private_clap.ps1
    - name: Prepare and verify macOS worker
      if: runner.os == 'macOS'
      shell: bash
      run: python tools/prepare_macos_clap.py
