name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    runs-on: windows-latest
    concurrency:
      group: desktop-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # Keep the existing desktop key; release tags can reuse main's cache.
          shared-key: desktop
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: Test update notifications
        run: node --experimental-strip-types --test desktop/tests/updatePolling.test.ts
      - name: Test themes, queue and error actions
        run: node --experimental-strip-types --test desktop/tests/appImprovements.test.ts desktop/tests/windowActions.test.ts
      - name: Test lyrics timing
        run: node --experimental-strip-types --test desktop/tests/lyricsTiming.test.ts
      - name: Test application behavior, shared audio and lyrics
        # Test compilation also checks the app binary, replacing cargo check.
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets
      - name: Test release notification and download URLs
        run: python -m unittest discover -s tools -p "test_notify_release.py"
      - name: Check bilingual release descriptions
        run: python tools/prepare_release_notes.py --check
      - name: Test release descriptions
        run: python -m unittest discover -s tools -p "test_release_notes.py"
      - name: Test component packaging and update manifests
        run: python -m unittest discover -s tools -p "test_components.py"

  release-windows:
    needs: [desktop, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      VITE_FASTCLOUD_SERVER_URL: ${{ secrets.FASTCLOUD_SERVER_URL }}
      FASTCLOUD_DISCORD_CLIENT_ID: ${{ vars.FASTCLOUD_DISCORD_CLIENT_ID }}
      FASTCLOUD_COMPONENT_MANIFEST: ${{ github.workspace }}/desktop/src-tauri/resources/component-manifest.json
    steps:
      - uses: actions/checkout@v7
      - name: Keep published releases immutable on reruns
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskRelease = gh release view $env:GITHUB_REF_NAME --json isDraft --jq .isDraft 2>&1
          if ($LASTEXITCODE -eq 0) {
            $taskPublished = ([string]$taskRelease).Trim() -eq 'false'
            "published=$($taskPublished.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          } elseif (($taskRelease -join ' ') -match '(?i)(release not found|HTTP 404)') {
            'published=false' >> $env:GITHUB_OUTPUT
          } else {
            throw 'Could not inspect the release; refusing to overwrite published assets.'
          }
          exit 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        if: steps.release.outputs.published != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.published != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.release.outputs.published != 'true'
        with:
          workspaces: desktop/src-tauri
          shared-key: desktop
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.release.outputs.published != 'true'
      - name: Verify release version
        if: steps.release.outputs.published != 'true'
        run: python tools/check_release_version.py
      - name: Prepare bilingual release description
        if: steps.release.outputs.published != 'true'
        run: python tools/prepare_release_notes.py
      - name: Verify updater signing key
        if: steps.release.outputs.published != 'true'
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY GitHub secret is missing' }
          if (-not $env:VITE_FASTCLOUD_SERVER_URL) { throw 'FASTCLOUD_SERVER_URL GitHub secret is missing' }
          if ($env:FASTCLOUD_DISCORD_CLIENT_ID -notmatch '^\d{17,20}$') { throw 'FASTCLOUD_DISCORD_CLIENT_ID repository variable must be a numeric Discord Application ID' }
      - run: npm ci
        if: steps.release.outputs.published != 'true'
        working-directory: desktop
      - name: Reuse unchanged CLAP worker
        if: steps.release.outputs.published != 'true'
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/clap/worker-lite
          key: clap-worker-windows-x64-${{ hashFiles('desktop/clap_worker.py', 'tools/prepare_private_clap.ps1') }}
      - name: Prepare pinned CLAP model and Windows worker
        if: steps.release.outputs.published != 'true'
        shell: pwsh
        run: ./tools/prepare_private_clap.ps1
      - name: Prepare reusable component files
        if: steps.release.outputs.published != 'true'
        run: python tools/prepare_components.py
      - name: Verify manifest embedded in the release
        if: steps.release.outputs.published != 'true'
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --lib components::tests::embedded_manifest_matches_application -- --exact
      - name: Build signed installer with CLAP
        if: steps.release.outputs.published != 'true'
        run: npm run tauri:private -- --bundles nsis
        working-directory: desktop
      - name: Keep full installer for first installs and legacy clients
        if: steps.release.outputs.published != 'true'
        run: python tools/stage_release_installer.py full
      - name: Bundle lightweight signed update from the built app
        if: steps.release.outputs.published != 'true'
        # Only the bundled resources differ; reuse the signed app build.
        run: npm run tauri -- bundle --config src-tauri/tauri.light.conf.json --bundles nsis --ci
        working-directory: desktop
      - name: Keep lightweight installer
        if: steps.release.outputs.published != 'true'
        run: python tools/stage_release_installer.py light
      - name: Include verified macOS release artifacts
        if: steps.release.outputs.published != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: macos-release-*
          merge-multiple: true
          path: desktop/release
      - name: Prepare latest.json and checksums
        if: steps.release.outputs.published != 'true'
        run: python tools/release_manifest.py
      - uses: softprops/action-gh-release@v3
        if: steps.release.outputs.published != 'true'
        with:
          name: Fastcloud ${{ github.ref_name }}
          prerelease: false
          draft: true
          make_latest: false
          generate_release_notes: true
          body_path: desktop/release-notes.md
          files: desktop/release/*
      - name: Publish only after every update file is uploaded
        if: steps.release.outputs.published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the prepared release.' }
      - name: Notify running applications
        env:
          FASTCLOUD_RELEASE_NOTIFY_TOKEN: ${{ secrets.FASTCLOUD_RELEASE_NOTIFY_TOKEN }}
        run: python tools/notify_release.py

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    concurrency:
      group: macos-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      VITE_FASTCLOUD_SERVER_URL: ${{ secrets.FASTCLOUD_SERVER_URL }}
      FASTCLOUD_DISCORD_CLIENT_ID: ${{ vars.FASTCLOUD_DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: macos-${{ matrix.arch }}
      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - name: Test native macOS application
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Verify release configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$VITE_FASTCLOUD_SERVER_URL"
          python tools/check_release_version.py
      - uses: actions/cache@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: desktop/src-tauri/resources/clap/worker-lite
          key: clap-worker-macos-${{ matrix.arch }}-${{ hashFiles('desktop/clap_worker.py', 'desktop/clap_features.py', 'tools/prepare_macos_clap.py') }}
      - name: Prepare and test native CLAP worker
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/prepare_macos_clap.py
      - name: Prepare content-addressed native components
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/prepare_components.py
      - name: Verify manifest embedded in native app
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FASTCLOUD_COMPONENT_MANIFEST: ${{ github.workspace }}/desktop/src-tauri/resources/component-manifest.json
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --lib components::tests::embedded_manifest_matches_application -- --exact
      - name: Build native signed updater and DMG
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          FASTCLOUD_COMPONENT_MANIFEST: ${{ github.workspace }}/desktop/src-tauri/resources/component-manifest.json
        run: npm run tauri -- build --config src-tauri/tauri.private.conf.json --config src-tauri/tauri.macos.conf.json --target ${{ matrix.arch }}-apple-darwin --bundles app,dmg --ci
      - name: Stage full macOS installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/stage_macos_release.py full ${{ matrix.arch }}
      - name: Bundle lightweight macOS updater
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri -- bundle --config src-tauri/tauri.light.conf.json --config src-tauri/tauri.macos.conf.json --target ${{ matrix.arch }}-apple-darwin --bundles app --ci
      - name: Stage lightweight macOS updater
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/stage_macos_release.py light ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: macos-release-${{ matrix.arch }}
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 7
