name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: astral-sh/setup-uv@v10
      - name: Verify updater signing key
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY GitHub secret is missing' }
      - run: npm ci
        working-directory: desktop
      - name: Prepare pinned CLAP model and Windows worker
        shell: pwsh
        run: ./tools/prepare_private_clap.ps1
      - name: Build signed installer with CLAP
        run: npm run tauri:private -- --bundles nsis
        working-directory: desktop
      - name: Prepare latest.json and checksums
        run: python tools/release_manifest.py
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: desktop/release/*
