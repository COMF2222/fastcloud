name: Release cache

on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    # Only trusted, successful default-branch checks produce shared caches.
    # This workflow never publishes artifacts and never receives signing keys.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            cache: release-windows-x64
            target: ''
          - runner: macos-15
            arch: aarch64
            cache: release-macos-aarch64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            cache: release-macos-x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: release-cache-${{ matrix.arch }}
      cancel-in-progress: true
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        id: rust-release
        with:
          workspaces: desktop/src-tauri
          shared-key: ${{ matrix.cache }}
      - run: npm ci
        if: steps.rust-release.outputs.cache-hit != 'true'
        working-directory: desktop
      - run: npm run build
        if: steps.rust-release.outputs.cache-hit != 'true'
        working-directory: desktop
      - name: Warm optimized Rust dependencies
        if: steps.rust-release.outputs.cache-hit != 'true'
        shell: bash
        env:
          CACHE_TARGET: ${{ matrix.target }}
        run: |
          args=(--manifest-path desktop/src-tauri/Cargo.toml --locked --release --lib --features tauri/custom-protocol)
          if [ -n "$CACHE_TARGET" ]; then args+=(--target "$CACHE_TARGET"); fi
          cargo build "${args[@]}"
      - name: Warm and verify native CLAP resources
        uses: ./.github/actions/clap-resources
        with:
          arch: ${{ matrix.arch }}
